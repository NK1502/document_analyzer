name: Build, Publish, and Deploy

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/ai-doc-analyzer-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/ai-doc-analyzer-frontend
  BACKEND_RENDER_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
  FRONTEND_RENDER_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify backend files
        run: ls -la ${{ github.workspace }}/backend

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          build-args: |
            PORT=8000

      - name: Trigger Render backend deploy
        if: ${{ env.BACKEND_RENDER_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ env.BACKEND_RENDER_HOOK_URL }}"

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify frontend files
        run: ls -la ${{ github.workspace }}/frontend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}

      - name: Trigger Render frontend deploy
        if: ${{ env.FRONTEND_RENDER_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ env.FRONTEND_RENDER_HOOK_URL }}"
