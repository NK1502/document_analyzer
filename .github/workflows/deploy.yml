name: Build, Push to Docker Hub & Deploy to Render

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub Credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error ::DOCKER_USERNAME or DOCKER_PASSWORD secret is missing! Please configure them in your GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Format Docker Username to Lowercase
        run: |
          DOCKER_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "DOCKER_USER=${DOCKER_USER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/ai-doc-analyzer-backend:latest
            ${{ env.DOCKER_USER }}/ai-doc-analyzer-backend:${{ github.sha }}

  build-and-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub Credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error ::DOCKER_USERNAME or DOCKER_PASSWORD secret is missing! Please configure them in your GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Format Docker Username to Lowercase
        run: |
          DOCKER_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "DOCKER_USER=${DOCKER_USER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/ai-doc-analyzer-frontend:latest
            ${{ env.DOCKER_USER }}/ai-doc-analyzer-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}

  deploy-to-render:
    name: Trigger Render Deployment
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    if: always() && (needs.build-and-push-backend.result == 'success' || needs.build-and-push-frontend.result == 'success')
    env:
      RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
      RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
      RENDER_FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}

    steps:
      - name: Trigger Render Backend Deploy Hook
        if: ${{ env.RENDER_BACKEND_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering Render Backend Deployment..."
          curl -fsS -X POST "${RENDER_BACKEND_DEPLOY_HOOK_URL}"

      - name: Trigger Render Frontend Deploy Hook
        if: ${{ env.RENDER_FRONTEND_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering Render Frontend Deployment..."
          curl -fsS -X POST "${RENDER_FRONTEND_DEPLOY_HOOK_URL}"

      - name: Trigger Render via API (Alternative)
        if: ${{ env.RENDER_API_KEY != '' && env.RENDER_BACKEND_SERVICE_ID != '' }}
        run: |
          echo "Triggering Render Backend via API..."
          curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_BACKEND_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json"
          
          if [ -n "${RENDER_FRONTEND_SERVICE_ID}" ]; then
            echo "Triggering Render Frontend via API..."
            curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_FRONTEND_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json"
          fi
